<div id="ziscus-comments" style="margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border);">
  <h3>留言板</h3>
  
  <!-- 表单结构保持不变，我们通过 JS 拦截它 -->
  <form id="comment-form" action="https://comments.canaiolos.com/submit" method="POST" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px;">
    <input type="hidden" name="slug" value="{{ .RelPermalink }}">
    
    <div style="display: flex; gap: 10px;">
      <input type="text" name="author" placeholder="您的暱稱 (必填)" required style="flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--entry); color: var(--primary);">
      <input type="email" name="email" placeholder="郵箱 (選填，不會公開)" style="flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--entry); color: var(--primary);">
    </div>
    
    <textarea name="content" placeholder="寫下您的留言..." required rows="4" style="padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--entry); color: var(--primary); resize: vertical;"></textarea>
    
    <!-- 按钮加上 id，方便 JS 控制 -->
    <button type="submit" id="submit-btn" style="align-self: flex-start; padding: 10px 24px; background: var(--primary); color: var(--theme); border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">提交留言</button>
  </form>

  <div id="comment-list">
    <p style="color: var(--secondary); font-size: 0.9em;">留言提交後須經站長審核才會公開顯示。</p>
  </div>
</div>

<!-- 👇 引入 JavaScript 接管提交过程 👇 -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('comment-form');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async function(e) {
    e.preventDefault(); // 阻止页面刷新/卡死
    
    // 改变按钮状态，防止重复点击
    const originalText = submitBtn.innerText;
    submitBtn.innerText = '提交中...';
    submitBtn.disabled = true;

    // 获取表单数据
    const formData = new FormData(form);
    
    try {
      // 1. 将 FormData 转换成普通的 JSON 对象
      const data = Object.fromEntries(formData.entries());
      
      // 2. 发送标准的 JSON 请求
      const response = await fetch(form.action, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json' // 👈 关键：告诉后端发送的是 JSON
        },
        body: JSON.stringify(data) // 👈 关键：把对象转成 JSON 字符串
      });

      if (response.ok) {
        alert('留言提交成功！等待站长审核后显示。');
        form.reset(); // 提交成功清空表单
      } else {
        const errorText = await response.text();
        alert('提交失败：' + errorText);
      }
    } catch (error) {
      alert('网络请求失败，请检查控制台 (F12) 报错信息。');
      console.error('Fetch Error:', error);
    } finally {
      submitBtn.innerText = originalText;
      submitBtn.disabled = false;
    }
  });
});
</script>
