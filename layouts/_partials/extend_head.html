{{ if .IsHome }}
<style>
  /* 只针对首页生效 */
  body {
    /* 使用线性渐变黑色半透明遮罩叠加在背景图上，最优雅的防文字看不清的写法 */
    background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('/images/home-bg.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
  }

  /* 去除首页原来默认的灰色背景，防止遮挡 */
  body.list {
    background-color: transparent !important;
  }

  /* 如果开启了深色模式，给背景图上面再加一层深色遮罩 */
  .dark body {
    background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('/images/home-bg.jpg');
  }
</style>
{{ end }}
