{{ if .IsHome }}
<style>
  /* 只针对首页生效 */
  body {
    /* 使用线性渐变黑色半透明遮罩叠加在背景图上 */
    background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('/images/home-bg.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
  }

  /* 去除首页原来默认的灰色背景，防止遮挡 */
  body.list {
    background-color: transparent !important;
  }

  /* 如果开启了深色模式，给背景图上面再加一层深色遮罩 */
  .dark body {
    background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('/images/home-bg.jpg');
  }
    /* ===== 首页大标题：天青色字 + 光晕，压在照片上也清晰 ===== */
  .hero h1 {
    color: #7dd3fc;
    font-weight: 800;

    text-shadow:
      0 0 28px rgba(125, 211, 252, 0.55),   /* 同色光晕 */
      0 2px 6px rgba(0, 0, 0, 0.9),         /* 紧贴文字的深阴影，保证边缘清楚 */
      0 10px 30px rgba(0, 0, 0, 0.6);       /* 大范围投影，把文字从背景里托起来 */

    display: inline-block;
    max-width: 100%;
    padding: 12px 24px;
    border-radius: 14px;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }

  /* ===== 首页副标题：深色底板 + 白字，压在照片上也清楚 ===== */
  .hero p {
    color: #ffffff;
    font-size: 17px;
    font-weight: 500;
    line-height: 1.6;
    display: inline-block;
    max-width: 100%;
    margin: 0;
    padding: 10px 18px;
    border-radius: 14px;
    background: rgba(0, 0, 0, 0.38);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    text-shadow:
      0 1px 3px rgba(0, 0, 0, 0.95),
      0 6px 22px rgba(0, 0, 0, 0.55);
  }

  /* ===== 页脚：改白字 + 底部渐深，避免被照片吃掉 ===== */
  .site-footer {
    color: #ffffff;
    border-top-color: rgba(255, 255, 255, 0.22);
    background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.5) 100%);
    text-shadow:
      0 1px 4px rgba(0, 0, 0, 0.9),
      0 6px 20px rgba(0, 0, 0, 0.55);
  }

  .site-footer a,
  .site-footer nav a {
    color: rgba(255, 255, 255, 0.95);
  }

  .site-footer a:hover,
  .site-footer nav a:hover {
    color: #ffffff;
  }

  .site-footer nav a + a::before {
    color: rgba(255, 255, 255, 0.45);
  }
</style>
<link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    AOS.init({
      duration: 600,
      easing: 'ease-out-cubic',
      once: true,
      offset: 80
    });
  });
</script>
{{ end }}
