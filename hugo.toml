# ============================================================
#  网站总配置文件 —— 新手只需要改这个文件里的几行
#  改完保存，运行 hugo server 就能看到效果
# ============================================================

# ⚠️ 上线前改成你的真实域名（结尾要带 /）
baseURL = "https://canaiolos.com/"
locale = "zh-CN"
defaultContentLanguage = "zh"
title = "風與海的傳說"

# 我们自己写了 static/robots.txt，所以不让 Hugo 自动生成
enableRobotsTXT = false

# 只关掉「标签汇总页」(/tags/)，保留单个标签页 (/tags/骑行/)
disableKinds = ["taxonomy"]

# 每页显示多少个视频
[pagination]
  pagerSize = 12

[markup]
  [markup.goldmark.renderer]
    # 允许在 Markdown 里直接写 HTML（比如嵌入播放器）
    unsafe = true
  [markup.highlight]
    style = "github-dark"
    noClasses = false

# ============================================================
#  下面这些是「网站信息」，改完全站生效
# ============================================================
[params]
  # 已修复：删除了下面重复的 mediaBase，并修正了域名拼写
  mediaBase = "https://media.canaiolos.com"
  description = ""
  author = "St.Kenrith"

  # 如果放在中国大陆服务器，填备案号；否则留空
  icp = ""
  [params.label]
  # 填入图片在 static 目录下的相对路径
  icon = "images/site-logo.png"
  # 可选：设置图片在导航栏中的渲染高度（像素），默认一般为 30
  iconHeight = 45
  # 可选：设置 Logo 旁边的文字，留空则默认显示站点标题
  text = ""

# ============================================================
#  顶部导航菜单
# ============================================================
[[menu.main]]
  name = "首頁"
  pageRef = "/"
  weight = 10

[[menu.main]]
  name = "日誌"
  pageRef = "/videos"
  weight = 20

[[menu.main]]
  name = "音樂"
  pageRef = "/music"
  weight = 25

[[menu.main]]
  name = "私密"
  pageRef = "/private"
  weight = 28

[[menu.main]]
  name = "關於我"
  pageRef = "/about"
  weight = 30