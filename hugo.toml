# ============================================================
#  网站总配置文件 —— 新手只需要改这个文件里的几行
#  改完保存，运行 hugo server 就能看到效果
# ============================================================

# ⚠️ 上线前改成你的真实域名（结尾要带 /）
baseURL = "https://canaiolos.com/"
locale = "zh-CN"
defaultContentLanguage = "zh"
title = "風與海的傳說"

# 我们自己写了 static/robots.txt，所以不让 Hugo 自动生成
enableRobotsTXT = false

# 关掉标签分类页，减少页面数量（标签仍然可以在文章里显示）
disableKinds = ["taxonomy", "term"]

# 每页显示多少个视频
[pagination]
  pagerSize = 12

[markup]
  [markup.goldmark.renderer]
    # 允许在 Markdown 里直接写 HTML（比如嵌入播放器）
    unsafe = true
  [markup.highlight]
    style = "github-dark"
    noClasses = false

# ============================================================
#  下面这些是「网站信息」，改完全站生效
# ============================================================
[params]
  # 已修复：删除了下面重复的 mediaBase，并修正了域名拼写
  mediaBase = "https://media.canaiolos.com"
  description = ""
  author = "St.Kenrith"

  # 评论系统 Giscus：四个值都填了才会显示评论区
  # 怎么拿到这四个值，见项目根目录的 README.md
  giscusRepo = "Kenaioloslau/my-vlog"
  giscusRepoId = "R_kgDOVg06zA"
  giscusCategory = "Comments"
  giscusCategoryId = "DIC_kwDOVg06zM4DKgg3"

  # 如果放在中国大陆服务器，填备案号；否则留空
  icp = ""
  [params.label]
  # 填入图片在 static 目录下的相对路径
  icon = "images/site-logo.png"
  # 可选：设置图片在导航栏中的渲染高度（像素），默认一般为 30
  iconHeight = 45
  # 可选：设置 Logo 旁边的文字，留空则默认显示站点标题
  text = ""

# ============================================================
#  顶部导航菜单
# ============================================================
[[menu.main]]
  name = "首頁"
  pageRef = "/"
  weight = 10

[[menu.main]]
  name = "全部視頻"
  pageRef = "/videos"
  weight = 20

[[menu.main]]
  name = "關於我"
  pageRef = "/about"
  weight = 30